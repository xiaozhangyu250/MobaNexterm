name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm dist:linux

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm dist:win

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: mobalinux-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
          if-no-files-found: ignore
