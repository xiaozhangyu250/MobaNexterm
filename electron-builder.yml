appId: com.mobanexterm.app
productName: MobaNexterm
copyright: Copyright © 2026 MobaNexterm

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asarUnpack:
  - resources/**

linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icon.png
  maintainer: MobaNexterm <noreply@mobanexterm.app>

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

mac:
  target:
    - dmg
  icon: build/icon.png
  category: public.app-category.developer-tools

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

publish:
  provider: github
  releaseType: draft
